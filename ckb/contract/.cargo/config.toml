[build]
target = "riscv64imac-unknown-none-elf"

[target.riscv64imac-unknown-none-elf]
# CKB mainnet VMs run ISA_IMC | B | MOP without atomics. `-a` removes atomic
# instructions; `+forced-atomics` lowers atomic ops to __atomic_* libcalls,
# which ckb-std's dummy-atomic feature provides (single-threaded VM).
rustflags = ["-C", "target-feature=-a,+forced-atomics"]
