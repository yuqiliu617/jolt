[package]
name = "jolt-r1cs"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "R1CS constraint data structures for the Jolt proving system"

[lints]
workspace = true

[dependencies]
jolt-claims.workspace = true
jolt-field = { path = "../jolt-field", default-features = false }
jolt-poly = { path = "../jolt-poly", default-features = false }
num-traits.workspace = true
rayon = { workspace = true, optional = true }
serde = { workspace = true, features = ["derive"] }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
jolt-field = { path = "../jolt-field", features = ["bn254"] }
rand_chacha = { workspace = true }
rand_core = { workspace = true }

[features]
default = ["std", "parallel"]
std = [
  "jolt-claims/std",
  "jolt-field/std",
  "jolt-poly/std",
  "num-traits/std",
  "serde/std",
  "thiserror/std",
  "tracing/std",
]
field-inline = ["jolt-claims/field-inline"]
parallel = ["std", "rayon", "jolt-poly/parallel"]
