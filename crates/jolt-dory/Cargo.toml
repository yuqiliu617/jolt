[package]
name = "jolt-dory"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Dory commitment scheme implementation for the Jolt zkVM"

[lints]
workspace = true

[features]
default = ["std", "parallel", "srs-cache"]
std = [
  "jolt-crypto/std",
  "jolt-field/std",
  "jolt-openings/std",
  "jolt-poly/std",
  "jolt-transcript/std",
  "dory/std",
  "serde/std",
  "tracing/std",
  "ark-serialize/std",
]
parallel = [
  "std",
  "dep:rayon",
  "jolt-crypto/parallel",
  "jolt-poly/parallel",
  "dory/parallel",
]
# Disk-cached SRS loading for setup generation; without it the SRS is
# generated fresh on every call. Verifiers consume a deserialized setup
# and never generate one.
srs-cache = ["std", "dory/disk-persistence"]

[dependencies]
jolt-crypto = { workspace = true, features = ["bn254"] }
jolt-field = { workspace = true }
jolt-openings = { workspace = true }
jolt-poly = { workspace = true }
jolt-transcript = { workspace = true }
dory = { package = "dory-pcs", version = "0.3.0", default-features = false, features = [
  "arkworks",
  "zk",
] }
rayon = { workspace = true, optional = true }
serde = { workspace = true, features = ["derive"] }
tracing.workspace = true
ark-serialize = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }
serde_json = { workspace = true }
rand_core = { workspace = true }
rand_chacha = { workspace = true }

[[bench]]
name = "dory"
harness = false

[package.metadata.cargo-machete]
ignored = ["rand_core", "rand_chacha"]
